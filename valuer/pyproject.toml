[project]
name = "valuer"
version = "0.1.0"
description = "Personal asset-based value-investing research system (SEC EDGAR, point-in-time facts, deterministic valuation)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
bloomberg = ["blpapi"]

[project.scripts]
valuer = "valuer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valuer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
