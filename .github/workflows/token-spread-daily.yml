name: token-spread daily snapshot

# Fetch prices / throughput / rental daily, recompute the spread, save a dated
# snapshot, rebuild the website (site/index.html) and commit. report.md is regenerated on
# Mondays (and on manual runs). To also publish the site on GitHub Pages: Settings → Pages →
# Source "GitHub Actions", then add the repository variable ENABLE_PAGES = true.
# Note: GitHub only runs scheduled workflows from the default branch.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: token-spread
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: token_spread
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: token_spread/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch
        run: python fetch/run_all.py
      - name: Compute + snapshot
        run: python compute.py
      - name: Weekly report
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python report.py
          else
            echo "Not Monday; skipping report"
          fi
      - name: Build website
        run: python build_site.py
      - name: Commit
        run: |
          git config user.name "token-spread-bot"
          git config user.email "token-spread-bot@users.noreply.github.com"
          git add -A data outputs snapshots charts report.md site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "token-spread snapshot $(date -u +%F)"
            git push
          fi
      - name: Upload site for Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: token_spread/site

  deploy-pages:
    if: vars.ENABLE_PAGES == 'true'
    needs: snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
