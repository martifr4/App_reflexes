name: token-spread daily snapshot

# Fetch prices / throughput / rental daily, recompute the spread, save a dated
# snapshot and commit it. report.md is regenerated on Mondays (and on manual runs).
# Note: GitHub only runs scheduled workflows from the default branch.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: token-spread
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: token_spread
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: token_spread/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch
        run: python fetch/run_all.py
      - name: Compute + snapshot
        run: python compute.py
      - name: Weekly report
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python report.py
          else
            echo "Not Monday; skipping report"
          fi
      - name: Commit
        run: |
          git config user.name "token-spread-bot"
          git config user.email "token-spread-bot@users.noreply.github.com"
          git add -A data outputs snapshots charts report.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "token-spread snapshot $(date -u +%F)"
            git push
          fi
