# Token Spread v0 — every modelling assumption lives here.
# Change a value, re-run `python compute.py && python report.py`.

# --- Models -----------------------------------------------------------------
# key:               short name used in outputs
# openrouter_id:     model id on OpenRouter (prices)
# inferencex_model:  display name on InferenceX (throughput)
# base_precision:    precision of the base-case throughput, per GPU.
#                    fp8 is the base case because it is what most OpenRouter
#                    providers report serving. gpt-oss-120b ships natively in
#                    MXFP4, so its base case is fp4 on both GPUs.
# variants:          extra (gpu, precision) cases reported alongside the base.
models:
  - key: llama-3.3-70b
    openrouter_id: meta-llama/llama-3.3-70b-instruct
    inferencex_model: Llama-3.3-70B-Instruct-FP8
    kind: dense 70B
    base_precision: {h100: fp8, b200: fp8}
    variants: [{gpu: b200, precision: fp4}]
  - key: gpt-oss-120b
    openrouter_id: openai/gpt-oss-120b
    inferencex_model: gpt-oss-120b
    kind: MoE 117B (5.1B active)
    base_precision: {h100: fp4, b200: fp4}
    variants: []
  - key: qwen3.5-397b
    openrouter_id: qwen/qwen3.5-397b-a17b
    inferencex_model: Qwen-3.5-397B-A17B
    kind: MoE 397B (17B active)
    base_precision: {h100: fp8, b200: fp8}
    variants: [{gpu: b200, precision: fp4}]
  - key: minimax-m3
    openrouter_id: minimax/minimax-m3
    inferencex_model: MiniMax-M3
    kind: MoE (large)
    base_precision: {h100: fp8, b200: fp8}
    variants: [{gpu: b200, precision: fp4}]
  - key: deepseek-r1
    openrouter_id: deepseek/deepseek-r1-0528
    inferencex_model: DeepSeek-R1-0528
    kind: MoE 671B (37B active)
    base_precision: {h100: fp8, b200: fp8}
    variants: [{gpu: b200, precision: fp4}]
  # --- added 2026-10: every other InferenceX model with fixed-length benchmarks.
  # Models listed with only b200 in base_precision have no H100 benchmark.
  # inferencex_key picks one variant when an InferenceX name groups several.
  - key: minimax-m2.5
    openrouter_id: minimax/minimax-m2.5
    inferencex_model: MiniMax-M2.5
    inferencex_key: minimaxm2.5
    kind: MoE
    base_precision: {h100: fp8, b200: fp8}
    variants: [{gpu: b200, precision: fp4}]
  - key: deepseek-v4-pro
    openrouter_id: deepseek/deepseek-v4-pro
    inferencex_model: DeepSeek-V4-Pro
    inferencex_key: dsv4
    kind: MoE
    base_precision: {b200: fp4}     # only fp4 benchmarked; no H100 data
    variants: []
  - key: glm-5
    openrouter_id: z-ai/glm-5
    inferencex_model: GLM-5
    inferencex_key: glm5
    kind: MoE
    base_precision: {b200: fp8}     # no H100 data
    variants: [{gpu: b200, precision: fp4}]
  - key: kimi-k2.5
    openrouter_id: moonshotai/kimi-k2.5
    inferencex_model: Kimi-K2.5
    inferencex_key: kimik2.5
    kind: MoE
    base_precision: {b200: int4}    # released as INT4 weights; no H100 data
    variants: [{gpu: b200, precision: fp4}]

gpus: [h100, b200]

# --- Throughput operating point ---------------------------------------------
# InferenceX sweeps concurrency, giving a throughput-vs-interactivity curve.
# We take the highest per-GPU throughput whose median interactivity
# (tokens/s seen by one user) is at least this floor. 30 tok/s ≈ a usable
# chat/API stream. The max-throughput point (no floor) is reported as an
# upper bound.
interactivity_floor_tok_s_per_user: 30

# Which benchmark configurations may be used.
allow_speculative_decoding: true   # MTP/EAGLE — common in production serving
allow_disaggregated_multinode: true # needed e.g. for DeepSeek-R1 on H100 (doesn't fit 8xH100 at fp8)

# --- Utilization -------------------------------------------------------------
# Fraction of rented hours spent serving at the chosen operating point.
utilization_base: 0.60
utilization_sensitivity: [0.30, 0.40, 0.50, 0.60, 0.70, 0.80]

# --- Input:output token ratio -----------------------------------------------
# Ratio of input (prompt) tokens to output tokens in the traffic mix.
# Benchmarks only measure 1:1 (1k/1k) and 8:1 (8k/1k) [and 1:8].
# Other ratios: throughput is interpolated linearly in log(ratio) between the
# measured points and held flat beyond them — those rows are estimate=true.
io_ratio_base: 3
io_ratio_sensitivity: [1, 3, 10]

# --- Prices ------------------------------------------------------------------
# How to collapse many OpenRouter providers into one price for the headline.
price_statistic: median            # median | min | max
exclude_providers: []              # e.g. [Cloudflare] to drop outliers

# --- Rental ------------------------------------------------------------------
# Which gpu_rental.csv series is the headline rental price.
rental_base_series: silicondata_index_faq

# --- Closed models (price-only analysis) --------------------------------------
# Their hardware and throughput are not public, so no spread is computed.
# Instead: (1) breakeven throughput — tokens/s per GPU needed for the list price
# to cover the GPU's rent at base utilization — and (2) price comparison with the
# open-weight models above. Price basis: OpenRouter's model-level list price
# (the lab's standard tier). Endpoint tiers (regional, priority, flex) are kept
# in data/api_prices_price_only.csv as a range. ':batch' variants are excluded.
closed_models:
  - {key: claude-fable-5.1,  openrouter_id: anthropic/claude-fable-5.1,  lab: Anthropic, tier: frontier}
  - {key: claude-opus-5.5,   openrouter_id: anthropic/claude-opus-5.5,   lab: Anthropic, tier: large}
  - {key: claude-sonnet-5.5, openrouter_id: anthropic/claude-sonnet-5.5, lab: Anthropic, tier: mid}
  - {key: claude-haiku-5.5,  openrouter_id: anthropic/claude-haiku-5.5,  lab: Anthropic, tier: small}
  - {key: gpt-6-astra,       openrouter_id: openai/gpt-6-astra,          lab: OpenAI,    tier: frontier}
  - {key: gpt-6.1-sol,       openrouter_id: openai/gpt-6.1-sol,          lab: OpenAI,    tier: mid}
  - {key: gpt-6-luna,        openrouter_id: openai/gpt-6-luna,           lab: OpenAI,    tier: small}
  - {key: grok-4.7,          openrouter_id: x-ai/grok-4.7,               lab: xAI,       tier: large}
  - {key: grok-build-0.1,    openrouter_id: x-ai/grok-build-0.1,         lab: xAI,       tier: mid}

# Open-weight models InferenceX lists but has not benchmarked at fixed sequence
# lengths (only agentic traces, ~100:1 input:output with ~90% prefix-cache hits,
# whose revenue depends on cached-input pricing; or no runs yet). Treated like
# closed models: breakeven throughput and price comparison only.
price_only_open_models:
  - {key: deepseek-v4.1-flash, openrouter_id: deepseek/deepseek-v4.1-flash, lab: DeepSeek, tier: open, reason: agentic benchmarks only}
  - {key: kimi-k3,             openrouter_id: moonshotai/kimi-k3,           lab: Moonshot, tier: open, reason: agentic benchmarks only}
  - {key: glm-5.2,             openrouter_id: z-ai/glm-5.2,                 lab: Zhipu,    tier: open, reason: agentic benchmarks only}
  - {key: qwen3.8-flash-next,  openrouter_id: qwen/qwen3.8-flash,           lab: Qwen,     tier: open, reason: agentic benchmarks only}
  - {key: qwen3.8-27b,         openrouter_id: qwen/qwen3.8-27b,             lab: Qwen,     tier: open, reason: no benchmark runs yet}

# --- Electricity (power price -> GPU-hour cost -> rent -> tokens) -------------
# power_cost_per_gpu_hour = allin_kw x load_factor x PUE x price_per_kWh
#   allin_kw   per-GPU IT power incl. its share of host CPU/RAM/NICs (SemiAnalysis
#              AI Cloud TCO model, from InferenceX's open-source constants)
#   PUE        facility overhead (cooling, power conversion). SemiAnalysis uses 1.2
#              for AI facilities; Uptime Institute's 2025 survey puts the global
#              average just above 1.5. 1.3 is an assumption between the two.
#   load_factor share of all-in nameplate power drawn on average. 1.0 = full load
#              every hour (conservative upper bound; idle GPUs still draw power).
power:
  pue_base: 1.3
  pue_sensitivity: [1.1, 1.2, 1.3, 1.4, 1.5, 1.6]
  load_factor: 1.0
  base_region: us_industrial
  eurostat_band: MWH70000-149999   # 70-150 GWh/yr non-household band, excl. VAT
  regions:
    # US: EIA Electric Power Monthly table 5.6.A, latest month, by sector
    - {key: us_industrial, label: U.S. average (industrial), source: eia, state: U.S. Total, sector: industrial}
    - {key: us_commercial, label: U.S. average (commercial), source: eia, state: U.S. Total, sector: commercial}
    - {key: virginia,   label: Virginia,   source: eia, state: Virginia,   sector: industrial}
    - {key: texas,      label: Texas,      source: eia, state: Texas,      sector: industrial}
    - {key: georgia,    label: Georgia,    source: eia, state: Georgia,    sector: industrial}
    - {key: ohio,       label: Ohio,       source: eia, state: Ohio,       sector: industrial}
    - {key: arizona,    label: Arizona,    source: eia, state: Arizona,    sector: industrial}
    - {key: oregon,     label: Oregon,     source: eia, state: Oregon,     sector: industrial}
    - {key: washington, label: Washington, source: eia, state: Washington, sector: industrial}
    # Europe: Eurostat nrg_pc_205 (non-household, bi-annual), converted at the ECB rate
    - {key: ireland,     label: Ireland,     source: eurostat, geo: IE}
    - {key: netherlands, label: Netherlands, source: eurostat, geo: NL}
    - {key: germany,     label: Germany,     source: eurostat, geo: DE}
    - {key: france,      label: France,      source: eurostat, geo: FR}
    - {key: spain,       label: Spain,       source: eurostat, geo: ES}
    - {key: sweden,      label: Sweden,      source: eurostat, geo: SE}
    - {key: finland,     label: Finland,     source: eurostat, geo: FI}
    - {key: norway,      label: Norway,      source: eurostat, geo: "NO"}  # quoted: bare NO is YAML for false

# --- GPU rental firm (neocloud) economics --------------------------------------
# Full cost of owning one GPU for one calendar hour, whether rented or idle:
#   capital  = capex x r / (1 - (1+r)^-n) / 8760   (annuity: depreciation + financing)
#   hosting  = all-in kW x colocation $/kW-month x 12 / 8760
#   power    = from the electricity layer above
#   ops      = staff, maintenance, support per GPU-hour
# Revenue = rent x occupancy (share of hours actually rented out).
# Every figure is sourced in data/rental_firm_sources.csv.
rental_firm:
  capex_usd_per_gpu: {h100: 35625, b200: 56250}   # 8-GPU HGX server / 8 (Mercatus: $285k, $450k typical)
  depreciation_years: 6                           # CoreWeave's useful life for GPU equipment
  depreciation_sensitivity: [4, 5, 6]
  cost_of_capital: 0.09                           # between CoreWeave's 5.9% IG tranche (2026) and ~15% early facilities
  colocation_usd_per_kw_month: 196.25             # CBRE H2 2025, 250-500 kW primary markets
  ops_usd_per_gpu_hour: 0.10                      # Mercatus: ~$0.80 per 8-GPU server-hour
  occupancy_base: 0.80                            # assumption; long-term contracts run higher, spot fleets lower
  occupancy_sensitivity: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
