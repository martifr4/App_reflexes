# Taller Demo SL: generic laser cutting and bending shop.
# SAMPLE VALUES: plausible Barcelona-area figures for demos only, not a real firm's rates.
# A real client's file is built from the onboarding questionnaire (Milestone 2).

client:
  id: demo_shop
  name: Taller Demo SL
  languages: [ca, es, en, fr]
  default_language: ca
  sales_email: comercial@tallerdemo.example
  office_hours: {weekdays: [0, 1, 2, 3, 4], start: "08:00", end: "17:00", timezone: Europe/Madrid}
  processes_offered: [laser, bending, welding]   # machining is not offered: always "needs review"
  max_sheet_mm: [3000, 1500]                      # largest part the laser takes
  sample_values: true

pricing:
  currency: EUR
  margin: 0.30                  # on top of cost
  minimum_order: 60.0           # € per order, before VAT
  programming_per_part_type: 25.0   # CAD/CAM + machine setup per distinct part
  material_basis: bbox          # bbox = charge the bounding rectangle; net = only the part area
  # Price range shown to the customer, as multipliers on the point estimate
  bands:
    high: [0.90, 1.15]
    medium: [0.80, 1.30]
    low: [0.70, 1.50]

  # Quantity discounts apply to processing (cutting, pierces, bending, welding), not material
  quantity_discounts:
    - {from: 1, discount: 0.00}
    - {from: 10, discount: 0.05}
    - {from: 50, discount: 0.10}
    - {from: 200, discount: 0.15}
    - {from: 1000, discount: 0.20}

  # Rush: deadline in fewer working days than `under_days` adds the surcharge (first match wins)
  rush:
    - {under_days: 2, surcharge: 0.50}
    - {under_days: 5, surcharge: 0.25}

materials:
  steel:
